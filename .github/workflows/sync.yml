name: Sync Sources

on:
  schedule:
    - cron: "17 */2 * * *" # 错峰执行，彻底消除 GitHub Actions 整点拥堵延迟
  workflow_dispatch:
  push:
    paths:
      - 'update.py'
      - '.github/workflows/**'

concurrency:
  group: sync-sources
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Update Script
        run: python3 update.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json zhihu.json tieba.json piliplus.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update apps, zhihu, tieba and piliplus sources"
            git push
          else
            echo "版本无变动，跳过提交。"
          fi
